<header class="header">
  <div class="logo">
    <a routerLink="/" routerLinkActive="active">
      <img
        src="https://i.imgur.com/9bieoqu.png"
        srcset="
          https://i.imgur.com/9bieoqu.png 1200w,
          https://i.imgur.com/9bieoqu.png 500w
        "
        sizes="(max-width: 600px) 500px, 1000px"
        alt="SAHP Logo"
      />
      <div class="logo-text">
        <strong>San Andreas Highway Patrol</strong>
        <span>Official Portal</span>
      </div>
    </a>
  </div>

  <nav>
    <a routerLink="classes" routerLinkActive="active">{{ 'HEADER.CLASSES' | translate }}</a>
    <a routerLink="instructors" routerLinkActive="active">{{ 'HEADER.INSTRUCTORS' | translate }}</a>
    <a routerLink="licenses" routerLinkActive="active">{{ 'HEADER.LICENSES' | translate }}</a>

    <a routerLink="admin" routerLinkActive="active" *ngIf="isAdmin2()">
      Admin
    </a>

    <a routerLink="logs" routerLinkActive="active" *ngIf="isLoggedIn()">
      Logs
    </a>

    <a routerLink="login" routerLinkActive="active" *ngIf="!isLoggedIn()">
      Login
    </a>

    <!-- SELECTOR DE IDIOMA -->
  <div class="language-selector">

    <button
      class="language-btn"
      type="button"
      (click)="toggleLanguageMenu()">

      {{ currentLanguage === 'es' ? '🇪🇸 ES' : '🇬🇧 EN' }}

      <span class="language-arrow">▾</span>

    </button>

    <div
      class="language-menu"
      *ngIf="languageMenuOpen">

      <button
        type="button"
        (click)="changeLanguage('es')"
        [class.selected]="currentLanguage === 'es'">
        🇪🇸 Español
      </button>

      <button
        type="button"
        (click)="changeLanguage('en')"
        [class.selected]="currentLanguage === 'en'">
        🇬🇧 English
      </button>

    </div>

  </div>

    <!-- USER INFO -->
    <div class="user-box" *ngIf="isLoggedIn()">
      <span class="user-name">
        👮 {{ getUsername() }}
      </span>
      <button class="logout-btn" (click)="logout()">{{ 'HEADER.LOGOUT' | translate }}</button>
    </div>
  </nav>
</header>
